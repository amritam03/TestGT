name: KarzAndDolls Mini GT Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 1. Download the inventory file saved by the last run
    - name: Download Previous Inventory History
      uses: actions/download-artifact@v4
      with:
        name: inventory-history
        path: .
      continue-on-error: true # Safe fallback: if this is the first run, ignore errors and keep going

    # 2. Execute tracking logic with history mapping
    - name: Run Restock Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python tracker.py

    # 3. Save the new inventory snapshot up to GitHub Storage for the next run
    - name: Upload Updated Inventory History
      uses: actions/upload-artifact@v4
      with:
        name: inventory-history
        path: inventory.txt
        retention-days: 1 # Keeps repository cleanup fast and tidy
