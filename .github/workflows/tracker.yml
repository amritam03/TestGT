name: KarzAndDolls Mini GT Tracker

on:
  schedule:
    - cron: '*/30 * * * *' # Automatically runs every 30 minutes
  workflow_dispatch: # Allows you to manually click "Run workflow" to test it

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Restock Script
      # This block securely passes your Repository Secrets down into the Python script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python tracker.py
