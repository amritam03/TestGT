name: KarzAndDolls Mini GT Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Grant permissions to read historical artifacts safely
permissions:
  actions: read
  contents: read

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # FIX: Pull the inventory file from the previous successful run of this exact workflow
    - name: Download Previous Inventory History
      uses: dawidd6/action-download-artifact@v7
      with:
        name: inventory-history
        workflow: run_tracker.yml # Connects specifically to this file
        workflow_conclusion: success
        if_no_artifact_found: warn

    - name: Run Restock Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python tracker.py

    - name: Upload Updated Inventory History
      uses: actions/upload-artifact@v4
      with:
        name: inventory-history
        path: inventory.txt
        retention-days: 2
