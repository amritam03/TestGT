name: KarzAndDolls Mini GT Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-stock:
    runs-runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # Native Cache: Restores the inventory file safely from your last run
    - name: Restore Mini GT Inventory Cache
      uses: actions/cache/restore@v4
      with:
        path: inventory.txt
        key: mini-gt-inventory-${{ github.run_id }}
        restore-keys: |
          mini-gt-inventory-

    - name: Run Restock Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python tracker.py

    # Native Save: Saves the updated file into permanent storage for your next loop
    - name: Save Updated Mini GT Inventory Cache
      uses: actions/cache/save@v4
      with:
        path: inventory.txt
        key: mini-gt-inventory-${{ github.run_id }}
